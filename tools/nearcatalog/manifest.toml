schema_version = "reborn.extension_manifest.v3"
id = "nearcatalog"
name = "NEAR Catalog"
version = "0.2.1"
description = "Explore the NEAR ecosystem: keyword-search projects, browse/filter the catalog by status and phase, look up full project profiles, find related projects, browse categories and groupings like trending, find people building on NEAR, and list awesome-near OSS libraries. All data sources are public; no authentication required."
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/nearcatalog_reborn_tool.wasm"

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "nearcatalog.list_projects"
description = "Run the legacy list projects operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/nearcatalog/list_projects.input.v1.json"
output_schema_ref = "schemas/nearcatalog/output.v1.json"
prompt_doc_ref = "prompts/nearcatalog/list_projects.md"
network_targets = [{ scheme = "https", host = "api.nearcatalog.xyz" }, { scheme = "https", host = "raw.githubusercontent.com" }]

