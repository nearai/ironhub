schema_version = "reborn.extension_manifest.v3"
id = "jina"
name = "Jina AI"
version = "0.2.4"
description = "Read web pages and PDFs as compact content, capture webpage screenshots, and search the web, arXiv, SSRN, or images through Jina AI. The host injects one Jina API key only for the Reader and Search API hosts."
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/jina_reborn_tool.wasm"

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "jina.read_url"
description = "Read a URL and convert its content to compact Markdown."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/jina/read_url.input.v1.json"
output_schema_ref = "schemas/jina/output.v1.json"
prompt_doc_ref = "prompts/jina/read_url.md"

[[tools.credentials]]
handle = "jina_runtime_key"
vendor = "jina"
audience = { scheme = "https", host = "r.jina.ai" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "jina.capture_screenshot_url"
description = "Create a screenshot URL for a web page."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/jina/capture_screenshot_url.input.v1.json"
output_schema_ref = "schemas/jina/output.v1.json"
prompt_doc_ref = "prompts/jina/capture_screenshot_url.md"

[[tools.credentials]]
handle = "jina_runtime_key"
vendor = "jina"
audience = { scheme = "https", host = "r.jina.ai" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "jina.search_web"
description = "Search the web with Jina Search."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/jina/search_web.input.v1.json"
output_schema_ref = "schemas/jina/output.v1.json"
prompt_doc_ref = "prompts/jina/search_web.md"

[[tools.credentials]]
handle = "jina_runtime_key"
vendor = "jina"
audience = { scheme = "https", host = "svip.jina.ai" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "jina.search_arxiv"
description = "Search arXiv papers with Jina Search."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/jina/search_arxiv.input.v1.json"
output_schema_ref = "schemas/jina/output.v1.json"
prompt_doc_ref = "prompts/jina/search_arxiv.md"

[[tools.credentials]]
handle = "jina_runtime_key"
vendor = "jina"
audience = { scheme = "https", host = "svip.jina.ai" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "jina.search_ssrn"
description = "Search SSRN papers with Jina Search."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/jina/search_ssrn.input.v1.json"
output_schema_ref = "schemas/jina/output.v1.json"
