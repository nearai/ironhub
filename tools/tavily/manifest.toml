schema_version = "reborn.extension_manifest.v2"
id = "tavily"
name = "Tavily"
version = "0.2.0"
description = "Search the web, search social media platforms (Reddit, X, LinkedIn, etc.), extract clean page content, map sites, and crawl domains with Tavily. Authentication uses the 'tavily_api_key' secret injected by the IronClaw host as a Bearer token, the LLM never knows the credentials"
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/tavily_reborn_tool.wasm"

[[host_api]]
id = "ironclaw.capability_provider/v1"
section = "capability_provider.tools"

[capability_provider.tools]

[[capability_provider.tools.capabilities]]
id = "tavily.social_media_search"
description = "Run the legacy social media search operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/tavily/social_media_search.input.v1.json"
output_schema_ref = "schemas/tavily/output.v1.json"
prompt_doc_ref = "prompts/tavily/social_media_search.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "tavily_api_key"
source = { type = "product_auth_account", provider = "tavily" }
audience = { scheme = "https", host_pattern = "api.tavily.com" }
target = { type = "header", name = "authorization", prefix = "Bearer " }
required = true

[[capability_provider.tools.capabilities]]
id = "tavily.search"
description = "Run the legacy search operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/tavily/search.input.v1.json"
output_schema_ref = "schemas/tavily/output.v1.json"
prompt_doc_ref = "prompts/tavily/search.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "tavily_api_key"
source = { type = "product_auth_account", provider = "tavily" }
audience = { scheme = "https", host_pattern = "api.tavily.com" }
target = { type = "header", name = "authorization", prefix = "Bearer " }
required = true

[[capability_provider.tools.capabilities]]
id = "tavily.extract"
description = "Run the legacy extract operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/tavily/extract.input.v1.json"
output_schema_ref = "schemas/tavily/output.v1.json"
prompt_doc_ref = "prompts/tavily/extract.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "tavily_api_key"
source = { type = "product_auth_account", provider = "tavily" }
audience = { scheme = "https", host_pattern = "api.tavily.com" }
target = { type = "header", name = "authorization", prefix = "Bearer " }
required = true

[[capability_provider.tools.capabilities]]
id = "tavily.crawl"
description = "Run the legacy crawl operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret", "external_write"]
default_permission = "ask"
visibility = "model"
input_schema_ref = "schemas/tavily/crawl.input.v1.json"
output_schema_ref = "schemas/tavily/output.v1.json"
prompt_doc_ref = "prompts/tavily/crawl.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "tavily_api_key"
source = { type = "product_auth_account", provider = "tavily" }
audience = { scheme = "https", host_pattern = "api.tavily.com" }
target = { type = "header", name = "authorization", prefix = "Bearer " }
required = true

[[capability_provider.tools.capabilities]]
id = "tavily.map"
description = "Run the legacy map operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/tavily/map.input.v1.json"
output_schema_ref = "schemas/tavily/output.v1.json"
prompt_doc_ref = "prompts/tavily/map.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "tavily_api_key"
source = { type = "product_auth_account", provider = "tavily" }
audience = { scheme = "https", host_pattern = "api.tavily.com" }
target = { type = "header", name = "authorization", prefix = "Bearer " }
required = true
