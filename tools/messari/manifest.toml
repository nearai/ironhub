schema_version = "reborn.extension_manifest.v3"
id = "messari"
name = "Messari"
version = "0.2.1"
description = "Messari crypto research and market data tool for Ironclaw. Access prices, market metrics, news, token unlocks, fundraising rounds, DeFi protocols, network stats, and Messari AI synthesis."
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/messari_reborn_tool.wasm"

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "messari.ask_ai"
description = "Run the legacy ask ai operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/messari/ask_ai.input.v1.json"
output_schema_ref = "schemas/messari/output.v1.json"
prompt_doc_ref = "prompts/messari/ask_ai.md"

[[tools.credentials]]
handle = "messari_api_key"
vendor = "messari"
audience = { scheme = "https", host = "api.messari.io" }
injection = { type = "header", name = "x-messari-api-key" }

