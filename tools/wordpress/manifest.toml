# PACKAGE TEMPLATE: replace every `wordpress.example.com` with the exact
# HTTPS host of one WordPress installation before creating the import ZIP.
# For WordPress Basic auth, enter base64(username:application-password)
# without the `Basic ` prefix when the generic credential popup appears.
schema_version = "reborn.extension_manifest.v2"
id = "wordpress"
name = "WordPress + WooCommerce"
version = "0.2.0"
description = "Typed WordPress and WooCommerce operations for one host-pinned site."
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/wordpress_reborn_tool.wasm"

[[host_api]]
id = "ironclaw.capability_provider/v1"
section = "capability_provider.tools"

[capability_provider.tools]

[[capability_provider.tools.capabilities]]
id = "wordpress.list_posts"
description = "List posts from the configured WordPress site."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/wordpress/list_with_status.input.v1.json"
output_schema_ref = "schemas/wordpress/output.v1.json"
prompt_doc_ref = "prompts/wordpress/list_posts.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "wordpress_basic_authorization"
source = { type = "product_auth_account", provider = "wordpress-basic-authorization" }
audience = { scheme = "https", host_pattern = "wordpress.example.com" }
target = { type = "header", name = "authorization", prefix = "Basic " }
required = true

[[capability_provider.tools.capabilities]]
id = "wordpress.get_post"
description = "Get one WordPress post by ID."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/wordpress/get_by_id.input.v1.json"
output_schema_ref = "schemas/wordpress/output.v1.json"
prompt_doc_ref = "prompts/wordpress/get_post.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "wordpress_basic_authorization"
source = { type = "product_auth_account", provider = "wordpress-basic-authorization" }
audience = { scheme = "https", host_pattern = "wordpress.example.com" }
target = { type = "header", name = "authorization", prefix = "Basic " }
required = true

