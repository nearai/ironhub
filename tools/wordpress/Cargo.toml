[package]
name = "wordpress-reborn-tool"
version = "0.2.0"
edition = "2021"
description = "WordPress and WooCommerce WASM extension for IronClaw Reborn"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.59.0"

[lib]
crate-type = ["cdylib"]

[features]
default = ["reborn"]
reborn = []

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[workspace]
