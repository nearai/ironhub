schema_version = "reborn.extension_manifest.v3"
id = "coingecko"
name = "CoinGecko"
version = "0.2.1"
description = "Universal cryptocurrency crypto price and market tool for CoinGecko. Support for both free Demo API key (api.coingecko.com) and Pro API key (pro-api.coingecko.com)."
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/coingecko_reborn_tool.wasm"

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "coingecko.ping"
description = "Run the legacy ping operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/coingecko/ping.input.v1.json"
output_schema_ref = "schemas/coingecko/output.v1.json"
prompt_doc_ref = "prompts/coingecko/ping.md"

[[tools.credentials]]
handle = "coingecko_demo_runtime_key"
vendor = "coingecko"
audience = { scheme = "https", host = "api.coingecko.com" }
injection = { type = "header", name = "x-cg-demo-api-key" }

[[tools.credentials]]
handle = "coingecko_pro_runtime_key"
vendor = "coingecko"
audience = { scheme = "https", host = "pro-api.coingecko.com" }
injection = { type = "header", name = "x-cg-pro-api-key" }

