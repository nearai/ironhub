schema_version = "reborn.extension_manifest.v2"
id = "defillama"
name = "DefiLlama"
version = "0.2.1"
description = "DefiLlama DeFi analytics: protocol/chain TVL, token prices, stablecoin circulation, yield/APY pools, DEX volumes, and fees/revenue — all from the free open API, no API key or auth setup needed. HOST LIMITATION: current IronClaw Reborn uses a fixed 500M WASM fuel budget and does not honor legacy WASM limit environment flags. The list_protocols, list_pools, and get_protocol actions may return a fuel-limit error on large live datasets until the host adds a supported configurable or per-capability fuel budget; all other actions run on stock limits."
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/defillama_reborn_tool.wasm"

[[host_api]]
id = "ironclaw.capability_provider/v1"
section = "capability_provider.tools"

[capability_provider.tools]

[[capability_provider.tools.capabilities]]
id = "defillama.list_protocols"
description = "Run the legacy list protocols operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/defillama/list_protocols.input.v1.json"
output_schema_ref = "schemas/defillama/output.v1.json"
prompt_doc_ref = "prompts/defillama/list_protocols.md"
network_targets = [{ scheme = "https", host_pattern = "api.llama.fi" }, { scheme = "https", host_pattern = "coins.llama.fi" }, { scheme = "https", host_pattern = "stablecoins.llama.fi" }, { scheme = "https", host_pattern = "yields.llama.fi" }]

