schema_version = "reborn.extension_manifest.v2"
id = "serper"
name = "Serper"
version = "0.2.0"
description = "Google Search, News, Images, Videos, Places, and Shopping API tool via Serper.dev"
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/serper_reborn_tool.wasm"

[[host_api]]
id = "ironclaw.capability_provider/v1"
section = "capability_provider.tools"

[capability_provider.tools]

[[capability_provider.tools.capabilities]]
id = "serper.search"
description = "Run the legacy search operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/serper/search.input.v1.json"
output_schema_ref = "schemas/serper/output.v1.json"
prompt_doc_ref = "prompts/serper/search.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "serper_api_key"
source = { type = "product_auth_account", provider = "serper" }
audience = { scheme = "https", host_pattern = "google.serper.dev" }
target = { type = "header", name = "X-API-KEY" }
required = true

