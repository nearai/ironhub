schema_version = "reborn.extension_manifest.v2"
id = "coingecko"
name = "CoinGecko"
version = "0.2.0"
description = "Universal cryptocurrency crypto price and market tool for CoinGecko. Support for both free Demo API key (api.coingecko.com) and Pro API key (pro-api.coingecko.com)."
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/coingecko_reborn_tool.wasm"

[[host_api]]
id = "ironclaw.capability_provider/v1"
section = "capability_provider.tools"

[capability_provider.tools]

[[capability_provider.tools.capabilities]]
id = "coingecko.ping"
description = "Run the legacy ping operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/coingecko/ping.input.v1.json"
output_schema_ref = "schemas/coingecko/output.v1.json"
prompt_doc_ref = "prompts/coingecko/ping.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "coingecko_demo_runtime_key"
source = { type = "product_auth_account", provider = "coingecko" }
audience = { scheme = "https", host_pattern = "api.coingecko.com" }
target = { type = "header", name = "x-cg-demo-api-key" }
required = true

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "coingecko_pro_runtime_key"
source = { type = "product_auth_account", provider = "coingecko" }
audience = { scheme = "https", host_pattern = "pro-api.coingecko.com" }
target = { type = "header", name = "x-cg-pro-api-key" }
required = true

