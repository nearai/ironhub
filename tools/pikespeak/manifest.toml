schema_version = "reborn.extension_manifest.v2"
id = "pikespeak"
name = "Pikespeak"
version = "0.2.0"
description = "Pikespeak is the  on-chain data analytics platform and portfolio tracker designed for NEAR. Exposes detailed portfolio staking/DeFi and general hundreds of features like wallet explorer, NEAR Intents, Network stats..."
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/pikespeak_reborn_tool.wasm"

[[host_api]]
id = "ironclaw.capability_provider/v1"
section = "capability_provider.tools"

[capability_provider.tools]

[[capability_provider.tools.capabilities]]
id = "pikespeak.balance"
description = "Run the legacy balance operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/pikespeak/balance.input.v1.json"
output_schema_ref = "schemas/pikespeak/output.v1.json"
prompt_doc_ref = "prompts/pikespeak/balance.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "pikespeak_api_key"
source = { type = "product_auth_account", provider = "pikespeak" }
audience = { scheme = "https", host_pattern = "api.pikespeak.ai" }
target = { type = "header", name = "x-api-key" }
required = true

