default_permission = "ask"
visibility = "model"
input_schema_ref = "schemas/wordpress/create_data.input.v1.json"
output_schema_ref = "schemas/wordpress/output.v1.json"
prompt_doc_ref = "prompts/wordpress/create_post.md"

