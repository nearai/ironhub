vendor = "jina"
audience = { scheme = "https", host = "svip.jina.ai" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[auth.jina]
method = "api_key"
display_name = "Jina API key"
fields = [
  { handle = "jina_runtime_key", label = "Jina API key", secret = true },
]
