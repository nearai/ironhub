schema_version = "reborn.extension_manifest.v2"
id = "youtube"
name = "YouTube"
version = "0.2.0"
description = "Read YouTube video, comment, channel, playlist, search, and transcript data."
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/youtube_reborn_tool.wasm"

[[host_api]]
id = "ironclaw.capability_provider/v1"
section = "capability_provider.tools"

[capability_provider.tools]

[[capability_provider.tools.capabilities]]
id = "youtube.get_video_details"
description = "Get metadata and statistics for one or more YouTube video IDs."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/youtube/get_video_details.input.v1.json"
output_schema_ref = "schemas/youtube/text.output.v1.json"
prompt_doc_ref = "prompts/youtube/get_video_details.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "youtube_api_key"
source = { type = "product_auth_account", provider = "youtube" }
audience = { scheme = "https", host_pattern = "www.googleapis.com" }
target = { type = "query_param", name = "key" }
required = true

[[capability_provider.tools.capabilities]]
id = "youtube.list_comments"
description = "List YouTube comment threads for a video or channel."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/youtube/list_comments.input.v1.json"
output_schema_ref = "schemas/youtube/text.output.v1.json"
prompt_doc_ref = "prompts/youtube/list_comments.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "youtube_api_key"
source = { type = "product_auth_account", provider = "youtube" }
audience = { scheme = "https", host_pattern = "www.googleapis.com" }
target = { type = "query_param", name = "key" }
required = true

[[capability_provider.tools.capabilities]]
id = "youtube.get_channel_stats"
description = "Get statistics and uploads-playlist metadata for a YouTube channel."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/youtube/get_channel_stats.input.v1.json"
output_schema_ref = "schemas/youtube/text.output.v1.json"
prompt_doc_ref = "prompts/youtube/get_channel_stats.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "youtube_api_key"
source = { type = "product_auth_account", provider = "youtube" }
audience = { scheme = "https", host_pattern = "www.googleapis.com" }
target = { type = "query_param", name = "key" }
required = true

[[capability_provider.tools.capabilities]]
id = "youtube.get_channel_videos"
description = "List recent videos from a channel uploads playlist."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/youtube/get_channel_videos.input.v1.json"
output_schema_ref = "schemas/youtube/text.output.v1.json"
prompt_doc_ref = "prompts/youtube/get_channel_videos.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "youtube_api_key"
source = { type = "product_auth_account", provider = "youtube" }
audience = { scheme = "https", host_pattern = "www.googleapis.com" }
target = { type = "query_param", name = "key" }
required = true

[[capability_provider.tools.capabilities]]
id = "youtube.search_videos"
description = "Search YouTube by keyword. This operation consumes substantially more API quota than reads by ID."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "ask"
visibility = "model"
input_schema_ref = "schemas/youtube/search_videos.input.v1.json"
output_schema_ref = "schemas/youtube/text.output.v1.json"
prompt_doc_ref = "prompts/youtube/search_videos.md"

[[capability_provider.tools.capabilities.runtime_credentials]]
handle = "youtube_api_key"
source = { type = "product_auth_account", provider = "youtube" }
audience = { scheme = "https", host_pattern = "www.googleapis.com" }
target = { type = "query_param", name = "key" }
required = true

[[capability_provider.tools.capabilities]]
id = "youtube.get_transcript"
description = "Fetch the plain-text transcript for one YouTube video."
effects = ["dispatch_capability", "network"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/youtube/get_transcript.input.v1.json"
output_schema_ref = "schemas/youtube/text.output.v1.json"
prompt_doc_ref = "prompts/youtube/get_transcript.md"
network_targets = [
  { scheme = "https", host_pattern = "youtube-transcript.ai" },
]
