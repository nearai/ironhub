schema_version = "reborn.extension_manifest.v3"
id = "etherscan"
name = "Etherscan"
version = "0.2.1"
description = "Allows queries to the Etherscan v2 API across 60+ EVM-compatible chains. Supports balances, transaction histories, ERC-20/721/1155 token transfers, contract ABIs/source code, and transaction statuses."
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/etherscan_reborn_tool.wasm"

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "etherscan.balance"
description = "Run the legacy balance operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/etherscan/balance.input.v1.json"
output_schema_ref = "schemas/etherscan/output.v1.json"
prompt_doc_ref = "prompts/etherscan/balance.md"

[[tools.credentials]]
handle = "etherscan_api_key"
vendor = "etherscan"
audience = { scheme = "https", host = "api.etherscan.io" }
injection = { type = "query_param", name = "apikey" }

