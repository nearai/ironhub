schema_version = "reborn.extension_manifest.v3"
id = "firecrawl"
name = "Firecrawl"
version = "0.2.1"
description = "Scrape, search, map, and crawl the web with Firecrawl (v2 API). 'scrape' returns clean markdown for one URL; 'search' finds pages by query; 'map' lists every URL on a site; 'crawl' + 'crawl_status' recursively scrape a whole site. Authentication uses the 'firecrawl_api_key' secret injected by the host as a Bearer token."
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/firecrawl_reborn_tool.wasm"

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "firecrawl.scrape"
description = "Scrape and extract content from one URL."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/firecrawl/scrape.input.v1.json"
output_schema_ref = "schemas/firecrawl/output.v1.json"
prompt_doc_ref = "prompts/firecrawl/scrape.md"

[[tools.credentials]]
handle = "firecrawl_api_key"
vendor = "firecrawl"
audience = { scheme = "https", host = "api.firecrawl.dev" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "firecrawl.search"
description = "Run the legacy search operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/firecrawl/search.input.v1.json"
output_schema_ref = "schemas/firecrawl/output.v1.json"
prompt_doc_ref = "prompts/firecrawl/search.md"

[[tools.credentials]]
handle = "firecrawl_api_key"
vendor = "firecrawl"
audience = { scheme = "https", host = "api.firecrawl.dev" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "firecrawl.map"
description = "Run the legacy map operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/firecrawl/map.input.v1.json"
output_schema_ref = "schemas/firecrawl/output.v1.json"
prompt_doc_ref = "prompts/firecrawl/map.md"

[[tools.credentials]]
handle = "firecrawl_api_key"
vendor = "firecrawl"
audience = { scheme = "https", host = "api.firecrawl.dev" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "firecrawl.crawl"
description = "Run the legacy crawl operation. See the prompt and input schema for its exact contract."
effects = ["dispatch_capability", "network", "use_secret", "external_write"]
default_permission = "ask"
visibility = "model"
input_schema_ref = "schemas/firecrawl/crawl.input.v1.json"
output_schema_ref = "schemas/firecrawl/output.v1.json"
prompt_doc_ref = "prompts/firecrawl/crawl.md"

[[tools.credentials]]
handle = "firecrawl_api_key"
vendor = "firecrawl"
audience = { scheme = "https", host = "api.firecrawl.dev" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "firecrawl.crawl_status"
description = "Get the status and results of a crawl job."
effects = ["dispatch_capability", "network", "use_secret"]
default_permission = "allow"
visibility = "model"
input_schema_ref = "schemas/firecrawl/crawl_status.input.v1.json"
output_schema_ref = "schemas/firecrawl/output.v1.json"
prompt_doc_ref = "prompts/firecrawl/crawl_status.md"

[[tools.credentials]]
handle = "firecrawl_api_key"
vendor = "firecrawl"
audience = { scheme = "https", host = "api.firecrawl.dev" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[auth.firecrawl]
method = "api_key"
display_name = "Firecrawl API key"
fields = [
  { handle = "firecrawl_api_key", label = "Firecrawl API key", secret = true },
]
