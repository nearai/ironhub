[package]
name = "frankfurter-fx-tool"
version = "0.1.0"
edition = "2021"
description = "Frankfurter foreign exchange (FX) rate and currency conversion tool for Ironclaw (WASM component)"
license = "MIT OR Apache-2.0"
authors = ["kent <account@gfigroup.io>"]
repository = "https://github.com/cuongdcdev/ironclaw-skills-tools"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
wit-bindgen = "0.41.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
